name: Mantener Supabase activo

# El plan gratis de Supabase pausa el proyecto tras 7 días sin actividad.
# Una lectura liviana dos veces por semana cuenta como actividad.
# Usa solo la clave publishable (ya pública en src/nube-config.js); sin sesión,
# la seguridad por filas devuelve una lista vacía, pero la consulta llega a la base.

on:
  schedule:
    - cron: '17 12 * * 1,4' # lunes y jueves, 12:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API de Supabase
        env:
          URL: https://jlnaavvofqgxpkpuxgoo.supabase.co
          CLAVE: sb_publishable_wNRGGbPhiMIUoo0UaN_CdQ_X3Uh31vd
        run: |
          curl -sS --fail-with-body --retry 3 --retry-delay 10 \
            -H "apikey: $CLAVE" \
            "$URL/rest/v1/registros?select=uid&limit=1"
          echo
